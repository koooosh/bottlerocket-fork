[package]
name = "aws-dev"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"
# Don't rebuild crate just because of changes to README.
exclude = ["README.md"]

[package.metadata.build-variant.image-layout]
os-image-size-gib = 5
data-image-size-gib = 3
publish-image-size-hint-gib = 8
partition-plan = "unified"

[package.metadata.build-variant.image-features]
grub-set-private-var = true
uefi-secure-boot = true
xfs-data-partition = false
systemd-networkd = true
in-place-updates = false
host-containers = false
erofs-root-partition = true

[package.metadata.build-variant]
kernel-parameters = [
    "console=tty0",
    "console=ttyS0,115200n8",
    "net.ifnames=0",
    "netdog.default-interface=eth0:dhcp4,dhcp6?",
    "systemd.unified_cgroup_hierarchy=0",
]
included-packages = [
    # core
    "early-boot-config-aws",
    "chrony-tools",
    "kernel-6.1",
    "release",
    "containerd-2.0",
    # tools
    "docker-init",
    "bash",
# tools
    "login",
    "iputils",
    "strace",
    "chrony-tools",
    "soci-snapshotter",
    "socat",
]

[lib]
path = "../variants.rs"

[build-dependencies]
# core
settings-defaults = { path = "../../packages/settings-defaults" }
settings-plugins = { path = "../../packages/settings-plugins" }
settings-migrations = { path = "../../packages/settings-migrations" }
